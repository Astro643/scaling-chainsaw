name: Deploy Discord Slash Commands Fixed

on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Register Command Definitions with Discord API
        run: |
          curl -X PUT "https://discord.com{DISCORD_APP_ID}/commands" \
          -H "Authorization: Bot ${DISCORD_TOKEN}" \
          -H "Content-Type: application/json" \
          -d '[
            {
              "name": "ticket",
              "description": "Open a support ticket with AI RAG context assistance",
              "type": 1,
              "options": [
                {
                  "name": "subject",
                  "description": "Brief headline of the issue",
                  "type": 3,
                  "required": true
                },
                {
                  "name": "description",
                  "description": "Detailed explanation of what is broken",
                  "type": 3,
                  "required": true
                },
                {
                  "name": "category",
                  "description": "The department or area affected",
                  "type": 3,
                  "required": false,
                  "choices": [
                    { "name": "Technical Support", "value": "technical" },
                    { "name": "Billing / Account", "value": "billing" },
                    { "name": "Discord General", "value": "discord" }
                  ]
                }
              ]
            }
          ]'
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}


